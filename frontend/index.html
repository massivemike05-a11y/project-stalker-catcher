<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link</title>
<style>
  body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f5f5f5; }
  .card { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 420px; width: 90%; }
  img { max-width: 100%; border-radius: 12px; margin-bottom: 1rem; }
  .terms { font-size: 0.85rem; color: #555; margin-bottom: 1.5rem; line-height: 1.4; text-align: left; }
  .hidden { display: none; }
  input { padding: 0.6rem; font-size: 1rem; width: 100%; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
  button { padding: 0.7rem 1.5rem; font-size: 1rem; background: #000; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; }
  button:hover { background: #333; }
  #status { margin-top: 1rem; font-weight: 600; color: green; min-height: 1.2rem; }
</style>
</head>
<body>

<div class="card">
  <img id="mainImg" src="https://via.placeholder.com/400x300?text=Your+Image+Here" alt="Content">
  <div id="consent" class="terms">
    <strong>Terms &amp; Cookies</strong><br>
    By entering this page, you agree that we log your handle, the time you visited, and where you came from (for example, Instagram). This data is visible only to the link owner.
  </div>
  <button id="acceptBtn">I Accept</button>
</div>

<div id="formCard" class="card hidden">
  <h2>Leave your handle</h2>
  <input type="text" id="handleInput" placeholder="your handle">
  <button id="submitBtn">Enter</button>
  <div id="status"></div>
</div>

<script>
const BACKEND_URL = "https://project-stalker-catcher-1.onrender.com";  // <-- CHANGE THIS after Render deploy

document.getElementById("acceptBtn").onclick = () => {
  document.getElementById("consent").style.display = "none";
  document.getElementById("acceptBtn").style.display = "none";
  document.getElementById("formCard").classList.remove("hidden");
};

document.getElementById("submitBtn").onclick = async () => {
  const handle = document.getElementById("handleInput").value.trim() || "anonymous";
  const referrer = document.referrer || "direct";
  try {
    const res = await fetch(BACKEND_URL + "/api/log", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({handle, referrer})
    });
    if (res.ok) {
      document.getElementById("status").textContent = "Logged. You can close this page.";
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("mainImg").style.display = "none";
      document.querySelector("#formCard h2").textContent = "Thanks.";
      document.getElementById("handleInput").style.display = "none";
    }
  } catch (e) {
    document.getElementById("status").textContent = "Could not log. Try again.";
  }
};
</script>

</body>
</html>
